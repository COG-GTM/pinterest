<pin-modal title='' klass='pinModal-{{pinIndex}}' size='medium'>
  @if (pin()) {
    <div class="row">
      <div class="large-5 columns">
        <a [href]="pin().url" target="_blank">
          <h5>
            {{pin().name}}
          </h5>
          <div class="pin-image">
            <img [src]="pin().image_url" alt="" width="500" [@flyInRight]="in">
          </div>
        </a>
        <br>
        </div>
        <div class="large-7 columns">
          @if (canAccessPin()) {
            <ul class="dropdown menu pull-right" data-dropdown-menu="">
              <li class="is-dropdown-submenu-parent">
                <div>
                  ...
                  <span class="fa fa-cog"></span>
                </div>
                <ul class="menu">
                  <li>
                    <a (click)="onEditPin()">
                      Edit
                    </a>
                  </li>
                </ul>
              </li>
            </ul>
          }
          <br>
            <p>
              {{pin().description}}
            </p>
            <h6>
              From {{pin().user?.name}}
              <img aria-hidden=true [src]="pin().user?.avatar" class="avatar"/>
            </h6>
            <hr>
              <h6 class="text-center">
                <strong>
                  Comments
                </strong>
                <br>
                </h6>
                @for (comment of comments(); track comment) {
                  <div [@flyInDown]="'in'">
                    <pin-pin-comment [comment]="comment" [authUser]="authUser()"></pin-pin-comment>
                    <br>
                    </div>
                  }
                  <pin-pin-comment-new [authUser]="authUser()" [pin]="pin()"></pin-pin-comment-new>
                </div>
              </div>
            }

            <div>
              @if (!pin()) {
                <h4 class="text-center">Loading ...</h4>
              }
            </div>
          </pin-modal>
