<pin-modal title='' klass='pinModal-{{pinIndex}}' size='medium'>
  @if ((pin | async)) {
    <div class="row">
      <div class="large-5 columns">
        <a [href]="(pin | async).url" target="_blank">
          <h5>
            {{(pin | async).name}}
          </h5>
          <div class="pin-image">
            <img [src]="(pin | async).image_url" alt="" width="500" [@flyInRight]="in">
          </div>
        </a>
        <br>
        </div>
        <div class="large-7 columns">
          @if (canAccessPin | async) {
            <ul class="dropdown menu pull-right" data-dropdown-menu="">
              <li class="is-dropdown-submenu-parent">
                <div>
                  ...
                  <span class="fa fa-cog"></span>
                </div>
                <ul class="menu">
                  <li>
                    <a (click)="onEditPin()">
                      Edit
                    </a>
                  </li>
                </ul>
              </li>
            </ul>
          }
          <br>
            <p>
              {{(pin | async).description}}
            </p>
            <h6>
              From {{(pin | async).user?.name}}
              <img aria-hidden=true [src]="(pin | async).user?.avatar" class="avatar"/>
            </h6>
            <hr>
              <h6 class="text-center">
                <strong>
                  Comments
                </strong>
                <br>
                </h6>
                @for (comment of comments | async; track comment) {
                  <div [@flyInDown]="'in'">
                    <pin-pin-comment [comment]="comment" [authUser]="authUser | async"></pin-pin-comment>
                    <br>
                    </div>
                  }
                  <pin-pin-comment-new [authUser]="authUser | async" [pin]="pin | async"></pin-pin-comment-new>
                </div>
              </div>
            }

            <div>
              @if (!(pin | async)) {
                <h4 class="text-center">Loading ...</h4>
              }
            </div>
          </pin-modal>
